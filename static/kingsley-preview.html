 const cam=mode===0?{x:car.x-Math.sin(car.angle)*31,z:car.z-Math.cos(car.angle)*31,y:-18,pitch:.14,yaw:car.angle+orbit}:mode===1?{x:car.x-Math.sin(car.angle)*7,z:car.z-Math.cos(car.angle)*7,y:-7,pitch:.055,yaw:car.angle+orbit}:{x:car.x-100,z:car.z-118,y:-120,pitch:.58,yaw:.23+orbit};polys.length=0;road();addEnv(); // Render full depth-sorted geometry
let rendered=[];for(let f of polys){let arr=f.v.map(p=>transform(p,cam));let clipped=[];for(let i=0;i<arr.length;i++){let a=arr[i],b=arr[(i+1)%arr.length],insideA=a[2]>.25,insideB=b[2]>.25;if(insideA)clipped.push(a);if(insideA!==insideB){let t=(.25-a[2])/(b[2]-a[2]);clipped.push(a.map((v,k)=>v+t*(b[k]-v)))}}if(clipped.length<3)continue;const maxZ=Math.max(...clipped.map(p=>p[2])),minZ=Math.min(...clipped.map(p=>p[2]));if(minZ>1450)continue;let pts=clipped.map(projected);rendered.push({pts,color:f.color,depth:(minZ+maxZ)/2})}rendered.sort((a,b)=>b.depth-a.depth);for(let f of rendered){ctx.beginPath();for(let i=0;i<f.pts.length;i++){let p=f.pts[i];if(i)ctx.lineTo(...p);else ctx.moveTo(...p)}ctx.closePath();ctx.fillStyle=f.color;ctx.fill()}
// Animated vehicle rendered from a 3D cuboid in world space
let vehicle=[];const a=car.angle;function rot(x,z){return [car.x+x*Math.cos(a)+z*Math.sin(a),car.z-x*Math.sin(a)+z*Math.cos(a)]}function vx(x,y,z){let q=rot(x,z);return [q[0],y,q[1]]}function vf(v,col){const q=v.map(p=>transform(p,cam));if(q.some(p=>p[2]<.25))return;vehicle.push({pts:q.map(projected),color:col,depth:q.reduce((s,p)=>s+p[2],0)/q.length})}if(mode!==1){vf([vx(-4,0,-7),vx(4,0,-7),vx(4,0,7),vx(-4,0,7)],'#17191e');vf([vx(-3,-4,-6),vx(3,-4,-6),vx(3,-4,6),vx(-3,-4,6)],'#bb8c3e');vf([vx(-3,-7,-3),vx(3,-7,-3),vx(3,-7,3),vx(-3,-7,3)],'#eac56d');vf([vx(-3,-4,6),vx(3,-4,6),vx(3,-7,3),vx(-3,-7,3)],'#344e60');vf([vx(-3,-4,-6),vx(3,-4,-6),vx(3,-7,-3),vx(-3,-7,-3)],'#a4d1e0');for(let f of vehicle){ctx.beginPath();f.pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=f.color;ctx.fill()}}
ctx.fillStyle='#f0c778';ctx.fillRect(W/2-1,H*.54-1,2,2);document.getElementById('speed').textContent=`${Math.round(Math.abs(car.speed)*.58)} MPH · ${car.z>START?'SOUTHBOUND':'START'} · ${mode===1?'DRIVER VIEW':'FREE DRIVE'}`;const aidx=AV.findIndex(a=>a.z>=car.z);document.getElementById('location').textContent=car.z>AV.at(-1).z?'SECOND AVENUE REACHED':`${aidx>=0?AV[aidx].name:'DEAL LAKE'} · KINGSLEY ST`;
mc.fillStyle='#1c3234';mc.fillRect(0,0,180,268);mc.fillStyle='#3b4650';mc.fillRect(81,6,18,256);for(let a of AV){let y=8+a.z/LENGTH*243;mc.fillRect(17,y-2,145,5);mc.fillStyle='#dcdacb';mc.font='10px Arial';mc.fillText(a.name.split(' ')[0],104,y-5);mc.fillStyle='#3b4650'}mc.fillStyle='#75a4bc';mc.fillRect(7,6,66,34);mc.fillStyle='#cba658';mc.beginPath();mc.arc(90,8+car.z/LENGTH*243,5,0,Math.PI*2);mc.fill();mc.fillStyle='#fff';mc.font='bold 9px Arial';mc.fillText('DEAL LAKE',5,18);mc.fillText('SOUTH ↓',4,257)}
function update(dt){const up=keys.has('w')||keys.has('ArrowUp'),down=keys.has('s')||keys.has('ArrowDown'),left=keys.has('a')||keys.has('ArrowLeft'),right=keys.has('d')||keys.has('ArrowRight');if(up)car.speed=Math.min(70,car.speed+48*dt);else if(down)car.speed=Math.max(-26,car.speed-58*dt);else car.speed*=Math.exp(-2.2*dt);if(Math.abs(car.speed)<.04)car.speed=0;const dir=(right?1:0)-(left?1:0);car.angle+=dir*(.55+Math.abs(car.speed)*.009)*dt*(car.speed<0?-1:1);car.angle=Math.max(-1.45,Math.min(1.45,car.angle));car.x+=Math.sin(car.angle)*car.speed*dt;car.z+=Math.cos(car.angle)*car.speed*dt;car.x=Math.max(-360,Math.min(360,car.x));car.z=Math.max(START,Math.min(LENGTH,car.z));if(car.z===LENGTH)car.speed=0}
function frame(t){try{const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);render();frames++;requestAnimationFrame(frame)}catch(e){document.getElementById('error').style.display='block';document.getElementById('error').textContent=e.stack||e.message;throw e}}requestAnimationFrame(frame);
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase().startsWith('arrow')?e.key:e.key.toLowerCase())});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase().startsWith('arrow')?e.key:e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k);b.classList.add('pressed')});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{keys.delete(k);b.classList.remove('pressed')})});canvas.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(drag){orbit=Math.max(-.6,Math.min(.6,orbit+(e.clientX-px)*.005));px=e.clientX}});canvas.addEventListener('pointerup',()=>drag=false);document.getElementById('view').onclick=()=>{mode=(mode+1)%3;orbit=0;document.getElementById('view').textContent=['CAMERA: CHASE','CAMERA: DRIVER','CAMERA: AERIAL'][mode]};document.getElementById('reset').onclick=()=>{car.x=0;car.z=START;car.angle=0;car.speed=0;mode=0;orbit=0;document.getElementById('view').textContent='CAMERA: CHASE'};document.getElementById('refs').onclick=()=>document.getElementById('refPanel').classList.toggle('open');const photos=window.KINGSLEY_REFERENCES||[];if(photos.length){document.getElementById('refPhoto').src=photos[0].src;document.getElementById('refNote').textContent=photos[0].note;let idx=0;document.getElementById('refPhoto').onclick=()=>{idx=(idx+1)%photos.length;document.getElementById('refPhoto').src=photos[idx].src;document.getElementById('refNote').textContent=photos[idx].note}}else document.getElementById('refs').disabled=true;
window.__KINGSLEY_DEBUG__={get car(){return {...car}},get frames(){return frames},avenues:AV,structures:structures.length};})();
