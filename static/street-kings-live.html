rder-radius:8px;font-size:10px;display:flex;align-items:center;gap:5px}.gold-dot,.red-dot,.blue-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#f6c565}.red-dot{background:#ff687c;margin-left:8px}.blue-dot{background:#5df9e0;margin-left:8px}#pad{position:absolute;bottom:15px;left:15px;display:flex;align-items:center;gap:5px}#pad>div{display:flex;flex-direction:column;gap:4px}#pad button,#recenter{background:#0a101bd9;border:1px solid #ae915a;border-radius:10px;width:51px;height:51px;font-size:20px;font-weight:900;backdrop-filter:blur(12px)}#pad button:active,#recenter:active{background:#6c4b19}#recenter{position:absolute;bottom:16px;right:18px;font-size:27px}#footer{height:64px;background:linear-gradient(180deg,#141016,#07080c);border-top:1px solid #a47c40;display:flex;align-items:center;justify-content:space-between;padding:5px 14px;gap:10px}#actionTip{font-size:11px;color:#d5b982;max-width:32%}.links{display:flex;gap:4px}.links button{background:#241a14;border:1px solid #8c6d3d;border-radius:6px;padding:9px 12px;font-size:11px;font-weight:800}.links button:hover{background:#4e351a}.overlay{position:absolute;z-index:10;inset:76px 0 64px;display:flex;justify-content:center;align-items:center;background:linear-gradient(#03050884,#030508bd);backdrop-filter:blur(6px)}.overlay[hidden]{display:none}.modal{width:min(92vw,460px);max-height:92%;overflow:auto;padding:25px 22px;background:linear-gradient(140deg,#1e1c1e,#080b11 70%);border:1px solid #bf9653;border-radius:18px;box-shadow:0 20px 80px #0009;text-align:center}.crest{font-size:46px;color:#f5c971;text-shadow:0 3px 30px #bd833e}.modal h1{font-size:clamp(21px,5vw,34px);color:#f5c976;margin:8px 0}.modal p{line-height:1.55;color:#d6c5b0}.modal button{display:block;width:100%;padding:14px;margin:9px 0;border-radius:9px;background:linear-gradient(#f7d897,#af752b);border:1px solid #f8e4b2;font-weight:900;color:#15100b;font-size:15px}.modal button.alt{background:#181c24;color:#f5d390;border-color:#7c613a}.modal input{width:100%;background:#161a21;border:1px solid #b18a52;color:white;font-size:15px;padding:13px;border-radius:9px;margin:6px 0}.modal-note{font-size:12px;color:#b8a795;margin-top:10px;overflow-wrap:anywhere}@media(max-width:650px){.top{height:65px}.top-center{display:none}#scene{height:calc(100dvh - 124px)}.top-score{gap:12px}.chip.sub{font-size:10px}#hudright{top:14px}#mapLegend{top:76px}.overlay{inset:65px 0 59px}#footer{height:59px}#actionTip{display:none}.links{width:100%;justify-content:space-between}.links button{padding:9px 7px;font-size:10px}#pad button{width:44px;height:44px}}

<div id="overlay" class="overlay" hidden><section class="modal"><div class="crest">♛</div><h1 id="modalTitle">STREET KINGS</h1><p id="modalText">Enter a living city. Make your move.</p><div id="modalActions"></div><div class="modal-note" id="modalNote"></div></section></div>
<script>
/* STREET KINGS — Visual city gameplay client. Existing Python remains authoritative for match outcomes. */
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('world');
if(!canvas)throw new Error('STREET KINGS interactive canvas #world missing');
const ctx=canvas.getContext('2d',{alpha:false});
if(!ctx)throw new Error('STREET KINGS canvas 2D renderer unavailable');
const names=['CROWN PLAZA','GOLD BLOCK','DOWNTOWN','SNEAKER ROW','MIDTOWN','STUDIO DISTRICT','UPTOWN','MARKET STREET','THE HEIGHTS'];
const streets=['OCEAN AVENUE','COOKMAN AVENUE','BOND STREET','COOKMAN AVENUE','MAIN STREET','SECOND AVENUE','SECOND AVENUE','SPRINGWOOD AVENUE','BORDEN AVENUE'];
const xy=[[960,190],[775,345],[510,495],[680,705],[395,280],[955,580],[190,140],[175,665],[1080,785]];
const edges=[[1,4],[0,2,3],[1,3,5,7],[1,2,4,5],[0,3,6],[2,3,8],[4,7],[3,6,8],[5,7]];
const params=new URLSearchParams(location.search),mode=params.get('mode')||'city',isPlay=mode==='play'||mode==='crew',isEmpire=['city','divisions','empire'].includes(mode);
let token=(()=>{try{return sessionStorage.getItem('sk_token')||''}catch{return ''}})(),room='',seat=0,roomState=null,roomSocket=null,empire=null,camera={x:570,y:410,zoom:1},car={x:395,y:280},rival={x:395,y:280},route=[],moving=false,requestPending=false,prevObjective='',gesture=null,mouseDown=null,toastTimeout=0,lastUpdate=0,particles=[],stateMode='explore',lastRoomStatus='',missionInFlight=false;
const DIST=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
let cityDistrict=4,cityRoute=[],cityTarget=null,lastHustleTap=0;
const rich=['#c8aa6f','#7d8e9b','#c58c55','#b7a080','#6a8b8b','#ba8663','#b7a08d','#b19b76','#8e8a9c'];
$('phase').textContent=mode==='crew'?'CREW CHALLENGE':isPlay?'THREE-MINUTE SHOWDOWN':mode==='divisions'?'NINE DIVISIONS':'BUILD YOUR EMPIRE';
$('modeName').textContent=mode==='crew'?'PRIVATE MATCH':isPlay?'COMPETITION':mode.toUpperCase();
document.body.classList.toggle('exploration',!isPlay);
function banner(msg){$('toast').textContent=msg;$('toast').classList.add('visible');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>$('toast').classList.remove('visible'),2600)}
function showModal(title,text,actions,note=''){const a=$('modalActions');$('overlay').hidden=false;$('modalTitle').textContent=title;$('modalText').textContent=text;$('modalNote').textContent=note;a.replaceChildren();actions.forEach(({label,fn,alt})=>{const b=document.createElement('button');b.textContent=label;if(alt)b.className='alt';b.addEventListener('click',fn);a.append(b)})}
function hideModal(){$('overlay').hidden=true}
function authHeader(){return token?{'Authorization':'Bearer '+token}:{}}
async function api(path,method='GET',body){const response=await fetch(path,{method,headers:{'Content-Type':'application/json',...authHeader()},body:body===undefined?undefined:JSON.stringify(body)});let data=await response.json().catch(()=>({}));if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:'Request failed ('+response.status+')');return data}
async function demoLogin(){const r=await api('/api/test-login','POST');token=r.token;(()=>{try{sessionStorage.setItem('sk_token',token)}catch{}})();banner('Welcome to STREET KINGS');return r}
async function login(){const username=$('loginUser')?.value||'',password=$('loginPass')?.value||'';const r=await api('/api/login','POST',{username,password});token=r.token;(()=>{try{sessionStorage.setItem('sk_token',token)}catch{}})();banner('Signed in');boot()}
async function registerAccount(){const username=$('loginUser')?.value||'',password=$('loginPass')?.value||'';await api('/api/register','POST',{username,password});await login()}
function accountView(){showModal('YOUR ACCOUNT','Sign in to compete, or use a temporary test account to explore the game.',[
{label:'BACK TO GAME',fn:hideModal,alt:true}]);let panel=$('modalActions');panel.insertAdjacentHTML('afterbegin','<input id="loginUser" autocomplete="username" placeholder="Username"><input id="loginPass" type="password" autocomplete="current-password" placeholder="Password">');let b=document.createElement('button');b.textContent='SIGN IN';b.addEventListener('click',()=>login().catch(e=>banner(e.message)));panel.append(b);const create=document.createElement('button');create.textContent='CREATE PLAYER ACCOUNT';create.addEventListener('click',()=>registerAccount().catch(e=>banner(e.message)));b.after(create)}
async function boot(){if(!token){if(isPlay){showModal('STREET KINGS · PLAY','Sign in to enter a three-minute match. Follow the glowing pickup, drive to the drop-off, and beat your rival’s verified score.',[{label:'SIGN IN OR REGISTER TO PLAY',fn:accountView}]);}else{hideModal();$('clock').textContent='—';$('target').textContent='ENTER YOUR CITY';$('subtarget').textContent='Touch neighborhoods to explore, then sign in to acquire';banner('Explore the nine divisions · Tap buildings');}return}if(isPlay){if(mode==='crew')showFriendMenu();else await playLobby()}else{try{empire=await api('/api/empire');}catch(e){banner(e.message)}hideModal();$('target').textContent='BUILD YOUR EMPIRE';$('subtarget').textContent='Tap buildings to inspect, acquire and develop territory';camera.zoom=1;camera.x=580;camera.y=440}}
async function playLobby(){showModal('TAKE THE CROWN','Three-minute competition. Drive the city, intercept rivals, and complete deliveries. Every match starts equal. Follow the blue glowing objective: drive to PICKUP, collect the contract, then reach DELIVERY. Tap streets or use the directional pad. Intercept a rival carrying a contract. Highest verified score after 180 seconds wins.',[
{label:'PLAY AGAINST COMPUTER',fn:()=>startAI().catch(e=>banner(e.message))},{label:'CHALLENGE A FRIEND',fn:showFriendMenu,alt:true},{label:'BACK TO HOME',fn:()=>location.assign('/'),alt:true}],'Gameplay is scored and timed by the existing STREET KINGS server.');}
function connectRoomSocket(){
  if(roomSocket){roomSocket.onclose=null;roomSocket.close();roomSocket=null}
  if(!room||!window.WebSocket)return;
  const activeRoom=room;
  const protocol=location.protocol==='https:'?'wss:':'ws:';
  try{
    const ws=new WebSocket(protocol+'//'+location.host+'/ws/rooms/'+encodeURIComponent(room));
    roomSocket=ws;
    ws.onmessage=e=>{if(activeRoom!==room)return;try{const data=JSON.parse(e.data);if(data.room_id===room)setRoomState(data)}catch(_){}};
    ws.onerror=()=>{};
    ws.onclose=()=>{if(roomSocket===ws){roomSocket=null;if(activeRoom===room&&roomState?.status!=='finished')setTimeout(connectRoomSocket,1600)}};
  }catch(_){roomSocket=null}
}
async function startAI(){const res=await api('/api/ai/start','POST');room=res.room_id;seat=res.seat??0;roomState=res.state;hideModal();setRoomState(roomState);connectRoomSocket();banner('MATCH LIVE · DRIVE TO THE OBJECTIVE');}
function showFriendMenu(){showModal('FRIEND MATCH','Create a room and send the code to a friend, or join their room.',[
{label:'CREATE ROOM',fn:async()=>{try{const x=await api('/api/rooms','POST',{duration:180});room=x.room_id;seat=x.seat??0;roomState=x.state;connectRoomSocket();showModal('YOUR ROOM CODE',room,[{label:'READY / START',fn:()=>readyUp().catch(e=>banner(e.message))},{label:'COPY CODE',fn:()=>navigator.clipboard?.writeText(room).then(()=>banner('Room code copied')).catch(()=>banner('Select and copy the code')),alt:true}],'Match begins when both players are ready.')}catch(e){banner(e.message)}}},{label:'JOIN ROOM',fn:()=>{showModal('JOIN A FRIEND','Enter your friend’s room code.',[{label:'JOIN MATCH',fn:async()=>{try{let code=$('friendRoom').value.trim(),r=await api('/api/rooms/'+encodeURIComponent(code)+'/join','POST');room=code;seat=r.seat??1;roomState=r.state;setRoomState(roomState);connectRoomSocket();await readyUp();hideModal()}catch(e){banner(e.message)}}},{label:'BACK',fn:showFriendMenu,alt:true}]);$('modalActions').insertAdjacentHTML('afterbegin','<input id="friendRoom" placeholder="ROOM CODE" autocapitalize="off">')}},{label:'BACK',fn:playLobby,alt:true}]);}
async function readyUp(){if(!room)return;let s=await api('/api/rooms/'+encodeURIComponent(room)+'/ready','POST');setRoomState(s);hideModal();if(s.status!=='running')banner('Waiting for rival to get ready');}
function getRun(){return roomState?.street_run||null}
function current(){return getRun()?.positions?.[seat]??4}
function nextObjective(){let r=getRun();if(!r)return null;let m=r.missions?.[seat];return m?{i:m.carrying?m.dropoff:m.pickup,carrying:m.carrying}:null}
function setRoomState(s){if(!s)return;roomState=s;const r=getRun();if(!r)return;const me=seat,other=1-seat,objective=nextObjective();$('myScore').textContent=s.scores?.[me]??r.run_points?.[me]??0;$('foeScore').textContent=s.scores?.[other]??r.run_points?.[other]??0;let sec=Number(s.remaining)||0;$('clock').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');$('districtTitle').textContent=names[current()];$('target').textContent=objective?(objective.carrying?'DELIVER TO ':'PICK UP AT ')+names[objective.i]:'LOOK FOR CONTRACTS';$('subtarget').textContent='Tap to drive · Hold your vehicle to claim/upgrade/take over · Double-tap for influence · Tap a rival carrying a contract to intercept';
const target=xy[current()],opponent=xy[r.positions?.[other]??4];if(!moving&&!route.length){car.x=target[0];car.y=target[1]}rival.x=opponent[0];rival.y=opponent[1];
if(s.status==='finished'&&lastRoomStatus!=='finished'){let mine=s.scores?.[me]??r.run_points[me],theirs=s.scores?.[other]??r.run_points[other];showModal(mine>theirs?'YOU TAKE THE CROWN':mine===theirs?'DRAW GAME':'RIVAL TAKES THE ROUND',`Final score: ${mine} – ${theirs}.`,[{label:'REMATCH',fn:()=>{room='';roomState=null;route=[];playLobby()}},{label:'BACK TO HOME',fn:()=>location.assign('/'),alt:true}]);}
lastRoomStatus=s.status;
if(s.status==='running'&&objective){let key=objective.i+':'+objective.carrying;if(key!==prevObjective){prevObjective=key;particles.push({x:xy[objective.i][0],y:xy[objective.i][1],life:75});}}
}
function bfs(start,goal){const q=[[start]],seen=new Set([start]);while(q.length){let path=q.shift(),v=path[path.length-1];if(v===goal)return path.slice(1);for(const nxt of edges[v])if(!seen.has(nxt)){seen.add(nxt);q.push([...path,nxt])}}return []}
async function moveStep(){if(requestPending||!route.length||!isPlay||!roomState||roomState.status!=='running')return;const to=route[0];if(!edges[current()].includes(to)){route=[];return}requestPending=true;const from=xy[current()],end=xy[to];try{const res=await api('/api/rooms/'+encodeURIComponent(room)+'/action','POST',{block:to,move:'drive',kind:0});route.shift();const ms=performance.now();moving={from,end,start:ms,duration:480};setRoomState(res)}catch(e){if(/cooldown/i.test(e.message)){setTimeout(()=>{requestPending=false;moveStep()},730);return}route=[];banner(e.message)}requestPending=false;}
async function autoInteract(){if(!isPlay||missionInFlight||!roomState||roomState.status!=='running'||moving||route.length||requestPending)return;let r=getRun(),m=r?.missions?.[seat];if(!m)return;let action=!m.carrying&&current()===m.pickup?'pickup':m.carrying&&current()===m.dropoff?'deliver':null;
if(!action)return;missionInFlight=true;try{let res=await api('/api/rooms/'+encodeURIComponent(room)+'/action','POST',{block:current(),move:action,kind:0});setRoomState(res);banner(action==='pickup'?'PACKAGE SECURED · DELIVER IT':'DELIVERY COMPLETE · SCORE UP');particles.push({x:car.x,y:car.y,life:80})}catch(e){if(!/cooldown/i.test(e.message))banner(e.message)}finally{missionInFlight=false}}
async function interactDistrict(i){
  if(isPlay){
    if(!roomState||roomState.status!=='running'){banner('Start a match to enter the competition');return}
    route=bfs(current(),i);if(!route.length){await autoInteract();banner('You are in '+names[i]);return}
    moveStep();return;
  }
  cityRoute=bfs(cityDistrict,i);
  cityTarget=i;
  camera.zoom=Math.max(1.12,camera.zoom);
  if(!cityRoute.length){arriveCity();return}
  banner('DRIVING TO '+names[i]);
  if(!moving)cityStep();
}
function cityStep(){
  if(!cityRoute.length){arriveCity();return}
  const next=cityRoute.shift();
  moving={from:[car.x,car.y],end:xy[next],start:performance.now(),duration:690};
  cityDistrict=next;
}
function arriveCity(){
  if(cityTarget==null)return;
  const i=cityTarget;cityTarget=null;
  $('districtTitle').textContent=names[i];
  camera.x=xy[i][0];camera.y=xy[i][1];
  if(!token){banner(names[i]+' · '+streets[i]+' · Sign in to acquire businesses');return}
  const owned=empire?.properties?.find(x=>x.district===i),cost=empire?.base_costs?.[i];
  const label=owned?'UPGRADE PROPERTY':'ACQUIRE PROPERTY';
  showModal(names[i],streets[i]+' · '+(owned?'Owned · Level '+owned.level:'Opportunity · '+(cost??'?')+' credits'),[
    {label,fn:async()=>{try{
      empire=await api('/api/empire/action','POST',{district:i,operation:owned?'upgrade':'acquire'});
      hideModal();banner(names[i]+' · '+(owned?'UPGRADED':'ACQUIRED'));
      particles.push({x:xy[i][0],y:xy[i][1],life:90});
    }catch(e){banner(e.message)}}},
    {label:'EXPLORE THE BLOCK',fn:()=>{camera.zoom=1.7;hideModal()},alt:true},
    {label:'RETURN TO CITY',fn:hideModal,alt:true}
  ]);
}

function direction(d){let here=isPlay?current():cityDistrict;let p=xy[here],opts=edges[here].map(i=>({i,dx:xy[i][0]-p[0],dy:xy[i][1]-p[1]}));const aim={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[d];opts.sort((a,b)=>(b.dx*aim[0]+b.dy*aim[1])/Math.hypot(b.dx,b.dy)-(a.dx*aim[0]+a.dy*aim[1])/Math.hypot(a.dx,a.dy));if(opts.length)interactDistrict(opts[0].i)}
async function streetAction(move){
  if(!isPlay||!room||!roomState||roomState.status!=='running'||requestPending)return;
  requestPending=true;
  try{
    const result=await api('/api/rooms/'+encodeURIComponent(room)+'/action','POST',{block:current(),move,kind:0});
    setRoomState(result);
    particles.push({x:car.x,y:car.y,life:85});
    banner(move==='intercept'?'RIVAL CONTRACT INTERCEPTED':'BLOCK INFLUENCE INCREASED');
  }catch(e){banner(e.message)}finally{requestPending=false}
}
async function captureCurrentBlock(){
  if(!isPlay||!room||roomState?.status!=='running'||moving||requestPending)return;
  const i=current(),b=roomState.blocks?.[i];
  if(!b)return;
  let move=b.owner===-1?'claim':b.owner!==seat?'takeover':b.level<5?'build':b.defense<4?'defend':null;
  if(!move){banner('BLOCK FULLY DEVELOPED');return}
  requestPending=true;
  try{
    const result=await api('/api/rooms/'+encodeURIComponent(room)+'/action','POST',{block:i,move,kind:0});
    setRoomState(result);particles.push({x:car.x,y:car.y,life:90});
    banner(move.toUpperCase()+' · '+names[i]+' · TERRITORY UPDATED');
  }catch(e){banner(e.message)}finally{requestPending=false}
}
function nearest(point){let best=0,min=Infinity;xy.forEach((x,i)=>{let d=DIST(point,x);if(d<min){min=d;best=i}});return best}
const rand=(seed)=>{let n=Math.sin(seed*12.9898+78.233)*43758.5453;return n-Math.floor(n)};
function size(){let w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(window.devicePixelRatio||1,2);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);return {w,h}}
function line(a,b,width,color){ctx.lineCap='round';ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}
function poly(p,fill,stroke){ctx.beginPath();ctx.moveTo(...p[0]);for(let i=1;i<p.length;i++)ctx.lineTo(...p[i]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function box(x,y,w,h,depth,paint,seed){const top=[[x-w/2,y-h],[x+w/2,y-h],[x+w/2+depth,y-h-depth*.46],[x-w/2+depth,y-h-depth*.46]],front=[[x-w/2,y-h],[x+w/2,y-h],[x+w/2,y],[x-w/2,y]],side=[[x+w/2,y-h],[x+w/2+depth,y-h-depth*.46],[x+w/2+depth,y-depth*.46],[x+w/2,y]];poly(front,paint,'#10131a');poly(side,'#38363b','#12141c');poly(top,'#c4ad83','#b7a174');let cols=Math.max(1,Math.round(w/19)),rows=Math.max(1,Math.round(h/21));for(let ry=0;ry<rows;ry++)for(let cx=0;cx<cols;cx++){let wx=x-w/2+(cx+.5)*w/cols,wy=y-h+(ry+.55)*h/rows;ctx.fillStyle=rand(seed+cx*17+ry*7)>.42?'#f0c67a':'#202f3b';ctx.fillRect(wx-3,wy-4,6,8);ctx.fillStyle='#0a1015';ctx.fillRect(wx-2,wy+3,4,1)}ctx.fillStyle='#dbba69';ctx.fillRect(x-w/2+8,y-11,w-16,3);}
const buildings=[];for(let j=0;j<9;j++)for(let i=0;i<13;i++){let x=40+i*99+(rand(i*15+j*37)-.5)*17,y=35+j*103+(rand(i*23+j*9)-.5)*15;let close=xy.some(p=>Math.hypot(x-p[0],y-p[1])<60),onRoad=false;for(let n=0;n<edges.length;n++)for(const m of edges[n])if(n<m){let a=xy[n],b=xy[m],t=clamp(((x-a[0])*(b[0]-a[0])+(y-a[1])*(b[1]-a[1]))/(DIST(a,b)**2),0,1),d=Math.hypot(x-a[0]-t*(b[0]-a[0]),y-a[1]-t*(b[1]-a[1]));if(d<40)onRoad=true}if(!onRoad&&!close)buildings.push({x,y,w:35+rand(i+j*4)*25,h:35+rand(i*2+j*18)*90,paint:rich[Math.floor(rand(i*7+j*8)*rich.length)],seed:i*34+j*3})}
let lastPaint=0;function draw(t){requestAnimationFrame(draw);if(t-lastPaint<45)return;lastPaint=t;const {w,h}=size(),s=clamp(Math.min(w/990,h/690)*camera.zoom,.28,2);ctx.fillStyle='#111b24';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(w/2-camera.x*s,h/2-camera.y*s);ctx.scale(s,s);
let grad=ctx.createLinearGradient(0,0,1200,900);grad.addColorStop(0,'#1c303c');grad.addColorStop(.75,'#28373c');grad.addColorStop(1,'#14252d');ctx.fillStyle=grad;ctx.fillRect(-300,-250,1900,1400);
// Asbury Park inspired waterfront: ocean to the east, boardwalk and beach along Ocean Avenue.
ctx.fillStyle='#166485';ctx.fillRect(1150,-150,300,1250);ctx.fillStyle='#a9bfbd';for(let k=0;k<35;k++){let x=1165+rand(k+44)*230,y=(k*93+t*.015)%1130-70;ctx.fillRect(x,y,25+rand(k)*30,1.5)}ctx.fillStyle='#d9b77d';ctx.fillRect(1100,-150,50,1250);ctx.fillStyle='#ab9470';ctx.fillRect(1075,-150,15,1250);for(let j=0;j<36;j++){ctx.fillStyle=j%2?'#b39a78':'#dbc49a';ctx.fillRect(1100,-150+j*39,50,2)}
// Rounded street network with distinct sidewalks, vehicle lanes, center marking and curb detail.
for(let i=0;i<edges.length;i++)for(let n of edges[i])if(i<n){let a=xy[i],b=xy[n];line(a,b,64,'#b6a17b');line(a,b,56,'#45505a');line(a,b,47,'#252d38');line(a,b,3,'#d6b874');for(let k=.1;k<1;k+=.11){let p=[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k],q=[a[0]+(b[0]-a[0])*(k+.045),a[1]+(b[1]-a[1])*(k+.045)];line(p,q,2.3,'#e5cf99')}}
// Buildings and neighborhoods, drawn in depth order.
buildings.sort((a,b)=>a.y-b.y).forEach(b=>{ctx.fillStyle='#05080c5c';ctx.fillRect(b.x-b.w/2+6,b.y+3,b.w+22,8);box(b.x,b.y,b.w,b.h,10,b.paint,b.seed)});
for(let i=0;i<60;i++){let x=26+i*19.5,y=55+rand(i*77)*820,near=xy.some(p=>DIST(p,[x,y])<65);if(near||x>1060)continue;ctx.fillStyle='#232e28';ctx.beginPath();ctx.arc(x,y,7+rand(i)*9,0,7);ctx.fill();ctx.fillStyle='#46614b';ctx.beginPath();ctx.arc(x-2,y-4,5+rand(i)*7,0,7);ctx.fill()}
xy.forEach((p,i)=>{let selected=isPlay&&nextObjective()?.i===i,owner=isPlay?roomState?.blocks?.[i]?.owner:-1;ctx.save();ctx.translate(...p);ctx.fillStyle=owner===seat&&isPlay?'#775621':owner>=0?'#642b38':'#121b23';ctx.beginPath();ctx.ellipse(0,7,39,18,0,0,7);ctx.fill();ctx.strokeStyle=selected?'#69ffe6':owner===seat&&isPlay?'#ffca57':owner>=0?'#ff6c82':'#d7ae6a';ctx.lineWidth=selected?4:2;ctx.beginPath();ctx.arc(0,-8,25+Math.sin(t*.004+i)*2,0,7);ctx.stroke();ctx.fillStyle='#080d14d9';ctx.fillRect(-70,-62,140,28);ctx.fillStyle=selected?'#6cfde7':'#ffe0a1';ctx.textAlign='center';ctx.font='bold 12px system-ui';ctx.fillText(names[i],0,-43);ctx.restore();if(selected){let pulse=1+.13*Math.sin(t*.007);ctx.strokeStyle='#70ffdc';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p[0],p[1]-10,34*pulse,0,7);ctx.stroke();ctx.fillStyle='#8cf9e1';ctx.beginPath();ctx.moveTo(p[0],p[1]-77-10*Math.sin(t*.005));ctx.lineTo(p[0]-12,p[1]-98-10*Math.sin(t*.005));ctx.lineTo(p[0]+12,p[1]-98-10*Math.sin(t*.005));ctx.closePath();ctx.fill()}});
// Live rivals and player vehicles. Server is the authority for score and district positions.
if(isPlay&&getRun()){drawVehicle(rival.x,rival.y,'#e4475e',t,false)}drawVehicle(car.x,car.y,'#f0bd4b',t,true);
particles=particles.filter(p=>p.life-->0);for(let p of particles){ctx.strokeStyle=`rgba(244,207,127,${p.life/100})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,(90-p.life)*1.3,0,7);ctx.stroke()}
ctx.restore();let vig=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.2,w/2,h/2,Math.max(w,h)*.8);vig.addColorStop(0,'#0000');vig.addColorStop(1,'#03040885');ctx.fillStyle=vig;ctx.fillRect(0,0,w,h);
if(moving){
  let f=clamp((t-moving.start)/moving.duration,0,1),eased=f*f*(3-2*f);
  car.x=moving.from[0]+(moving.end[0]-moving.from[0])*eased;
  car.y=moving.from[1]+(moving.end[1]-moving.from[1])*eased;
  if(f>=1){moving=false;if(isPlay){autoInteract();if(route.length)moveStep()}else if(cityRoute.length)cityStep();else arriveCity()}
}
if((isPlay&&roomState?.status==='running'||!isPlay&&moving)&&camera.zoom>1.05){
  camera.x+=(car.x-camera.x)*.095;camera.y+=(car.y-camera.y)*.095;
}
}
function drawVehicle(x,y,color,t,isMe){ctx.save();ctx.translate(x,y-8);ctx.rotate(-.12);ctx.fillStyle='#070b13a6';ctx.beginPath();ctx.ellipse(4,11,33,12,0,0,7);ctx.fill();ctx.fillStyle=color;poly([[-30,-5],[-18,-20],[14,-20],[29,-8],[26,8],[-27,8]],color);poly([[-15,-20],[11,-20],[19,-7],[-19,-7]],'#182b39','#f6e9c1');ctx.fillStyle='#fdf4cb';ctx.fillRect(-28,1,7,4);ctx.fillRect(21,1,7,4);ctx.fillStyle='#080b11';ctx.fillRect(-19,6,9,7);ctx.fillRect(15,6,9,7);ctx.fillStyle=isMe?'#ffe9ae':'#ffa2ad';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText(isMe?'YOU':'RIVAL',0,-33+Math.sin(t*.003)*2);ctx.restore()}
function screenToWorld(screenX,screenY){let w=canvas.clientWidth,h=canvas.clientHeight,s=clamp(Math.min(w/990,h/690)*camera.zoom,.28,2);return [camera.x+(screenX-w/2)/s,camera.y+(screenY-h/2)/s]}
canvas.addEventListener('pointerdown',e=>{
  mouseDown={x:e.clientX,y:e.clientY,cx:camera.x,cy:camera.y,t:performance.now()};
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointercancel',()=>{mouseDown=null});
canvas.addEventListener('pointermove',e=>{
  if(!mouseDown)return;
  let dx=e.clientX-mouseDown.x,dy=e.clientY-mouseDown.y;
  if(Math.hypot(dx,dy)>9){let s=clamp(Math.min(canvas.clientWidth/990,canvas.clientHeight/690)*camera.zoom,.28,2);camera.x=mouseDown.cx-dx/s;camera.y=mouseDown.cy-dy/s}
});
canvas.addEventListener('pointerup',e=>{
  if(!mouseDown)return;
  let d=Math.hypot(e.clientX-mouseDown.x,e.clientY-mouseDown.y),held=performance.now()-mouseDown.t;
  mouseDown=null;if(d>14)return;
  const rect=canvas.getBoundingClientRect(),at=screenToWorld(e.clientX-rect.left,e.clientY-rect.top),i=nearest(at);
  if(isPlay&&roomState?.status==='running'&&DIST(at,[car.x,car.y])<75&&held>=680){captureCurrentBlock();return}
  if(isPlay&&roomState?.status==='running'&&DIST(at,[car.x,car.y])<75&&performance.now()-lastHustleTap<330){lastHustleTap=0;streetAction('hustle');return}
  if(isPlay&&DIST(at,[car.x,car.y])<75)lastHustleTap=performance.now();
  if(isPlay&&roomState?.status==='running'&&DIST(at,[rival.x,rival.y])<46&&getRun()?.positions?.[seat]===getRun()?.positions?.[1-seat]&&getRun()?.missions?.[1-seat]?.carrying){streetAction('intercept');return}
  if(DIST(at,xy[i])<155)interactDistrict(i);
  else{camera.x=at[0];camera.y=at[1]}
});
canvas.addEventListener('wheel',e=>{camera.zoom=clamp(camera.zoom*(e.deltaY<0?1.12:.89),.7,2.8);e.preventDefault()},{passive:false});document.querySelectorAll('#pad [data-dir]').forEach(b=>b.addEventListener('click',()=>direction(b.dataset.dir)));window.addEventListener('keydown',e=>{const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',w:'up',a:'left',s:'down',d:'right'};if(map[e.key]){direction(map[e.key]);e.preventDefault()}else if(e.key==='h'&&isPlay){streetAction('hustle');e.preventDefault()}});
$('recenter').addEventListener('click',()=>{camera.x=isPlay?car.x:570;camera.y=isPlay?car.y:410;camera.zoom=isPlay?1.75:1.05});$('overview').addEventListener('click',()=>{camera.zoom=1;camera.x=570;camera.y=410});$('mission').addEventListener('click',()=>{let objective=nextObjective();if(objective){camera.x=xy[objective.i][0];camera.y=xy[objective.i][1];camera.zoom=1.8;banner('NEXT OBJECTIVE · '+names[objective.i]);if(roomState?.status==='running')interactDistrict(objective.i)}else banner('Explore businesses to build your empire')});$('home').addEventListener('click',()=>location.assign('/'));$('account').addEventListener('click',accountView);
let lastRefresh=0;async function tick(){if(isPlay&&room&&!missionInFlight&&Date.now()-lastRefresh>1100){lastRefresh=Date.now();try{const s=await api('/api/rooms/'+encodeURIComponent(room)+'/refresh','POST');setRoomState(s)}catch(e){banner('Connection: '+e.message)}}if(isPlay&&roomState?.status==='running'&&!moving&&!requestPending&&route.length)moveStep();setTimeout(tick,600)}
