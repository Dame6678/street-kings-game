services:
  - type: web
    name: street-kings-demo
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: STREET_KINGS_TEST_LOGIN
        value: "false"
      - key: STREET_KINGS_MATCH_SECONDS
        value: "180"
      - key: STREET_KINGS_DB
        value: /var/data/streetkings.sqlite3
    disk:
      name: street-kings-data
      mountPath: /var/data
      sizeGB: 1
